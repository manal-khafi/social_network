services:
  db:
    image: postgres:17
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socielle_network
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./back_end
    container_name: backend_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3500:3500"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/socielle_network?schema=public
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: imanemharach@gmail.com
      SMTP_PASS: "qrhiyehjndrvqzld"
      # Auth tokens (access + refresh)
      AUTH_SECRET: ariqerhtuzerj
      AUTH_SECRET_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET: ariqerhtuzerj_refresh
      AUTH_REFRESH_SECRET_EXPIRES_IN: 24h

      # Reset password token (used by both jwt.ts and authService)
      RESET_SECRET: your_super_secret_key
      RESET_EXPIRES_IN: 15m
      RESET_PASSWORD_SECRET: your_super_secret_key
      RESET_PASSWORD_EXPIRES_IN: 15m

      # Email verification token
      EMAIL_VERIFY_SECRET: email_verify_super_secret
      EMAIL_VERIFY_EXPIRES_IN: 24h
      NODE_ENV: development
    networks:
      - app_network
    volumes:
      - ./back_end:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules

    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "smtp.gmail.com:142.250.102.108"
    command: sh -c "
      echo 'En attente de la base de données...' &&
      sleep 5 &&
      npx prisma generate &&
      npm run dev"

  frontend:
    build: ./front_end
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app_network
    volumes:
      - ./front_end:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3500

volumes:
  pgdata:
  backend_node_modules:

networks:
  app_network:
    driver: bridge
    name: sociel_network
