# Serves the built SPA. The outer reverse proxy (../nginx/default.conf) forwards
# non-/api traffic here; this block only needs history-API fallback + caching.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets - safe to cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
