version: '3.8'

services:
  db:
    image: postgres:17
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socielle_network
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./back_end
    container_name: backend_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3500:3500"

    # ✅ IMPORTANT: load all secrets (Firebase + SMTP + JWT...) from .env
    env_file:
      - ./back_end/.env

    environment:
      # ✅ keep only non-secret overrides here (optional)
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:root@db:5432/socielle_network?schema=public
      FIREBASE_SERVICE_ACCOUNT_PATH: /usr/src/app/src/config/serviceAccountKey.json
      FIREBASE_STORAGE_BUCKET: anmougar-34ca5.firebasestorage.app

    networks:
      - app_network
    volumes:
      - ./back_end:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
      - ./back_end/serviceAccountKey.json:/usr/src/app/serviceAccountKey.json:ro

    command: sh -c "
      echo 'En attente de la base de données...' &&
      sleep 5 &&
      npx prisma migrate deploy &&
      npx prisma generate &&
      npm run dev"

  frontend:
    build: ./front_end
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app_network
    volumes:
      - ./front_end:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3500

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:

networks:
  app_network:
    driver: bridge
    name: sociel_network
