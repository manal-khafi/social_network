# Public reverse proxy: TLS termination + routing to the app containers.
# HTTPS is prepared below but commented out until a domain + certificates exist
# (see DEPLOYMENT.md). Until then everything is served over :80.

upstream backend_api {
    server backend:3500;
}
upstream frontend_app {
    server frontend:80;
}

# Send "Connection: upgrade" only for actual WebSocket handshakes.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Outer cap for request bodies, incl. multipart uploads (the backend accepts
    # files up to 100 MB; the extra leaves room for multipart framing). JSON bodies
    # are limited separately by the backend (BODY_LIMIT, 1mb). nginx default is 1M.
    client_max_body_size 110M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;

    # Backend API
    location /api/ {
        proxy_pass http://backend_api;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO (WebSocket) — long-lived upgraded connection
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded media (served by the backend)
    location /uploads/ {
        proxy_pass http://backend_api;
    }

    # Backend health probe
    location = /health {
        proxy_pass http://backend_api;
        access_log off;
    }

    # Frontend (built SPA served by the frontend container)
    location / {
        proxy_pass http://frontend_app;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- ACME HTTP-01 challenge (uncomment when issuing Let's Encrypt certs) ---
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

