name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Dummy value: prisma.config.ts requires DATABASE_URL to load, but nothing in CI
# opens a DB connection (typecheck + lint + tests with a mocked Prisma + build only).
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back_end/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests + auth integration tests (supertest against the Express app,
      # Prisma and SMTP mocked: no database or network needed).
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose parses env_file / ${VAR:?} at build time; a throwaway env is enough.
      - run: cp .env.example .env
      - name: Build images
        run: docker compose build
